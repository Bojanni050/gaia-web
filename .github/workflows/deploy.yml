name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build:web
      - run: yarn test --watchAll=false
        env:
          CI: true

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy gaia-web on the VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          # Same VPS, same public-IPv4-for-this-hop-only pattern as
          # Gaia-Cloud's gaia-api deploy (services stay Tailscale/
          # localhost-bound; only this SSH hop is public).
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /root/gaia-web
            git fetch --all
            git reset --hard origin/main

            # Keep the outgoing image tagged for a fast manual rollback
            # (`docker stop gaia-web && docker rm gaia-web && docker run
            # ... gaia-web:previous`) if something slips past the health
            # check below.
            docker tag gaia-web:latest gaia-web:previous 2>/dev/null || true

            docker build -t gaia-web:latest .

            docker stop gaia-web 2>/dev/null || true
            docker rm gaia-web 2>/dev/null || true
            docker run -d --name gaia-web --network gaia_net \
              -p 127.0.0.1:8090:80 --restart unless-stopped gaia-web:latest

            sleep 3
            if ! curl -sf http://127.0.0.1:8090/ > /dev/null; then
              echo "Health check failed — rolling back to the previous image."
              docker stop gaia-web && docker rm gaia-web
              docker run -d --name gaia-web --network gaia_net \
                -p 127.0.0.1:8090:80 --restart unless-stopped gaia-web:previous
              exit 1
            fi

            docker image prune -f
            docker ps --format 'table {{.Names}}\t{{.Status}}' | grep gaia-web
